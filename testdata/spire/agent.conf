# SPIRE agent for the idpdbg interop tests: attests with a join token so
# the server has an agent to list.
agent {
    data_dir = "/run/spire/agent"
    log_level = "INFO"
    server_address = "idpdbg-spire-server"
    server_port = "8081"
    socket_path = "/run/spire/agent/public/api.sock"
    trust_domain = "spire.test"
    insecure_bootstrap = true
}

plugins {
    KeyManager "memory" {
        plugin_data {}
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
