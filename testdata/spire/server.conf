# SPIRE server for the idpdbg interop tests (scripts/spire.sh).
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/admin/api.sock"
    trust_domain = "spire.test"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    # The SVID idpdbg mints for itself over the admin socket administers the
    # server over TCP (mTLS).
    admin_ids = ["spiffe://spire.test/idpdbg-admin"]
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }
    KeyManager "memory" {
        plugin_data {}
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
}
