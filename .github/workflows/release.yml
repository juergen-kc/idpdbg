name: release

# Push a tag like v0.2.0 to build every platform, attest the archives'
# provenance and publish a GitHub release with SHA256SUMS. The release notes
# are the tag's section of CHANGELOG.md (scripts/release-notes.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fail before building when CHANGELOG.md has no notes for this tag.
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      # GitHub only stores attestations for public repositories (or private
      # ones owned by an organization on a paid plan).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" $prerelease \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
